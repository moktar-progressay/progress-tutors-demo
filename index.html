<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ec2f73" />
    <title>ProgressTutors - Tuition Management Demo</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const basePath = "/progress-tutors-demo";
      const cleanPath = window.location.pathname.startsWith(`${basePath}/`)
        ? window.location.pathname.slice(basePath.length) || "/"
        : window.location.pathname;

      if (!window.location.hash && cleanPath !== "/") {
        window.location.replace(`${basePath}/#${cleanPath}${window.location.search}`);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
