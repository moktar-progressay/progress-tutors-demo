name: Validate changes

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/teacher-calendar-and-lesson-workflow

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
